<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | UAVO Forms</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <img src="img/logo.png" alt="Logo UAVO" class="auth-logo">
                <h1>Crear Cuenta</h1>
                <p>Regístrate como estudiante para acceder a los cuestionarios</p>
            </div>

            <div id="mensaje-alerta" class="alert alert-error"></div>

            <form id="form-registro">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Ej. Ana López" required>
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" class="form-control" placeholder="ejemplo@escuela.edu" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>

                <button type="submit" id="btn-registro" class="btn btn-primary btn-block">
                    Registrarme
                </button>
            </form>

            <div class="auth-footer">
                ¿Ya tienes una cuenta? <a href="index.html">Inicia sesión aquí</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
