<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Alumno | EvaluaWeb</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar">
        <a href="panel-alumno.html" class="navbar-brand">EvaluaWeb | Alumno</a>
        <div class="navbar-user">
            <span id="nombre-usuario">Cargando usuario...</span>
            <button id="btn-logout" class="btn btn-secondary btn-sm">Cerrar sesión</button>
        </div>
    </nav>

    <main class="container">
        <div class="dashboard-header">
            <div>
                <h1>Cuestionarios Disponibles</h1>
                <p style="color: var(--text-muted);">Selecciona un examen activo para comenzar.</p>
            </div>
        </div>

        <div id="mensaje-alerta" class="alert"></div>

        <!-- Cuadrícula de exámenes publicados -->
        <section id="lista-cuestionarios-alumno" class="grid-cards">
            <div class="card">
                <p style="color: var(--text-muted);">Buscando cuestionarios disponibles...</p>
            </div>
        </section>

        <!-- Sección de historial de intentos -->
        <h2 class="section-title">Mi Historial de Resultados</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Cuestionario</th>
                        <th>Fecha</th>
                        <th>Calificación</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-historial-alumno">
                    <tr>
                        <td colspan="4" style="color: var(--text-muted); text-align: center;">
                            Aún no has realizado ningún cuestionario.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/alumno.js"></script>
</body>
</html>
