<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Plataforma de Cuestionarios</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <img src="img/logo.png" alt="Logo UAVO" class="auth-logo">
                <h1>UAVO Forms</h1>
                <p>Inicia sesión para acceder a tus cuestionarios</p>
            </div>

            <!-- Contenedor para mostrar errores de inicio de sesión desde JS -->
            <div id="mensaje-alerta" class="alert alert-error"></div>

            <form id="form-login">
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" class="form-control" placeholder="ejemplo@escuela.edu" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" id="btn-login" class="btn btn-primary btn-block">
                    Iniciar Sesión
                </button>
            </form>

            <div class="auth-footer">
                ¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
